name: Create Latest/Official Release

on:
  workflow_dispatch:
    inputs:
      is_official_release:
        type: boolean
        default: false
        description: "Official Release?"
        required: false
      official_fog_version:
        type: string
        description: "Official Release FOG Version"
        required: false

defaults:
  run:
    shell: bash

# Only one official release build at a time.
#
# cancel-in-progress is deliberately false: a second click must never kill a
# ~50-minute build that may already be uploading. The second run queues instead,
# which also makes an accidental double-fire visible in the Actions tab rather
# than silent.
#
# This serializes, it does not dedupe. Two things stop a queued run from
# publishing over the first one's release:
#
#   - the dated tag carries a UTC timestamp, so two runs cannot land on the same
#     tag (this group also makes "same second" unreachable); and
#   - both the official and the dated paths are checked against an existing
#     release before anything is uploaded -- see the guards in input_checks and
#     in the release job.
#
# The guards matter because the failure they prevent is silent:
# softprops/action-gh-release UPDATES an existing release rather than refusing,
# replacing same-named assets while leaving the git tag on whichever commit it
# was originally cut from. The result is a tag that serves bytes its own commit
# does not contain.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  input_checks:
    runs-on: ubuntu-24.04

    steps:
      # The FOG App identity, scoped to this repo, matching the standard set in
      # the fog-workflows repo: every job that touches GitHub gets its own token
      # rather than falling back to GITHUB_TOKEN, so a release run reads as the
      # FOG bot end to end instead of a mix of the bot and github-actions[bot].
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fos"

      - name: Make sure that the input text field is filled in if the input checkbox is selected and vice versa
        run: |
          is_official="${{ inputs.is_official_release }}"
          fog_version="${{ inputs.official_fog_version }}"
          if [[ "$is_official" == "true" && "$fog_version" == "" ]]; then
            echo "Official FOG Version was not entered, but Official Release checkbox was selected!"
            exit 1
          fi
          if [[ "$is_official" == "false" && "$fog_version" != "" ]]; then
            echo "Official Release checkbox was not selected, but Official Release FOG Version was entered!"
            exit 1
          fi

      # Fail fast on the one tag that is predictable at dispatch time.
      #
      # An official release tags $fog_version, so re-running one for a version
      # that already shipped is a plausible mistake -- and without this it would
      # only be caught by the guard in the release job, ~50 minutes and six
      # builds later. The dated path cannot be checked here because its tag is
      # not decided until the release job stamps the time.
      - name: Refuse an official release whose tag already exists
        if: inputs.is_official_release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          fog_version="${{ inputs.official_fog_version }}"
          if gh release view "$fog_version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $fog_version already exists. Delete it (and its tag) first, or pick another version -- re-running would replace its assets while leaving the tag on the original commit."
            exit 1
          fi

  # Fetch every Buildroot source package ONCE, into the shared DL cache, before
  # any init build starts -- mirroring create_experimental_release.yml.
  #
  # Without this each of the three init jobs downloads the whole package set
  # from upstream independently, so a single tarball being briefly unreachable
  # fails a ~50-minute job and, because `release` needs all six builds, discards
  # the entire release. That is exactly how the 2026-08-03 run died: upstream
  # cabextract-1.11.tar.gz 404'd for a moment and the Buildroot backup mirror
  # (sources.buildroot.net) does not carry that tarball at all, so the package
  # had no second source. Fetching once here means a blip has one chance to hit
  # us instead of three, and a re-run restores from cache rather than going back
  # out to the network.
  #
  # Narrowing the window was not enough on its own: on 2026-08-17 the same
  # package took down an experimental build again, this time with every address
  # of www.cabextract.org.uk timing out rather than 404ing. cabextract now has
  # actual mirrors -- see seedCabextract() in build.sh, which seeds this cache
  # from Debian or the Fedora lookaside when upstream is unreachable, and
  # tests/checks/cabextract-mirrors.sh. This job still earns its place: one
  # fetch, shared by six builds, restored from cache on a re-run.
  #
  # BR2_DL_DIR="$(HOME)/.buildroot-dl" is set in all three configs/fs*.config,
  # which is what makes the cache path below the one Buildroot actually uses.
  download_filesystem_packages:
    needs: input_checks

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            buildroot-dl-

      - name: Download all FS packages
        run: ./build.sh -i --fs-download-only

  build_kernel_arm64:
    needs: input_checks

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build arm64 kernel
        run: ./build.sh --install-dep -nka arm64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-arm64
          path: dist
          retention-days: 1

  build_kernel_x86:
    needs: input_checks

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build x86 kernel
        run: ./build.sh --install-dep -nka x86

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-x86
          path: dist
          retention-days: 1

  build_kernel_x64:
    needs: input_checks

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build x64 kernel
        run: ./build.sh --install-dep -nka x64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-x64
          path: dist
          retention-days: 1

  build_initrd_arm64:
    needs: [input_checks, download_filesystem_packages]

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-arm64
          key: ccache-arm64-${{ github.run_id }}
          restore-keys: |
            ccache-arm64-

      - name: Build arm64 initrd
        run: ./build.sh --install-dep -nfa arm64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-arm64
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-arm64
          path: fssourcearm64/buildrootarm64.log
          retention-days: 30

  build_initrd_x86:
    needs: [input_checks, download_filesystem_packages]

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-x86
          key: ccache-x86-${{ github.run_id }}
          restore-keys: |
            ccache-x86-

      - name: Build x86 initrd
        run: ./build.sh --install-dep -nfa x86

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-x86
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-x86
          path: fssourcex86/buildrootx86.log
          retention-days: 30

  build_initrd_x64:
    needs: [input_checks, download_filesystem_packages]

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-x64
          key: ccache-x64-${{ github.run_id }}
          restore-keys: |
            ccache-x64-

      - name: Build x64 initrd
        run: ./build.sh --install-dep -nfa x64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-x64
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-x64
          path: fssourcex64/buildrootx64.log
          retention-days: 30

  release:
    needs:
      [
        build_kernel_arm64,
        build_kernel_x86,
        build_kernel_x64,
        build_initrd_arm64,
        build_initrd_x86,
        build_initrd_x64,
      ]

    runs-on: ubuntu-24.04

    outputs:
      tag_name: ${{ steps.export_tag.outputs.tag_name }}

    steps:
      # Its own token: `steps` is job-scoped, so input_checks' token is not
      # visible here. This is the job whose identity is most visible -- it is
      # what stamps the tag and publishes the release.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fos"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download distribution files
        uses: actions/download-artifact@v8
        with:
          pattern: distribution-files-*
          merge-multiple: true
          path: distribution-files

      # DO NOT change the release name. FOG uses this format to grab the releases for the Kernel Update page.
      - name: Set release name variable
        run: |
          echo "RELEASE_NAME=Latest from $(date '+%Y-%m-%d')" >> $GITHUB_ENV
          
      # Timestamped, not just dated, so two runs on the same day cannot target
      # the same tag. A bare %Y%m%d collided on any second release in a day --
      # and the collision was silent, because the release action updates an
      # existing release in place and does not move its tag, leaving that tag
      # pointing at the earlier commit while serving the later build's binaries.
      #
      # Matches create_experimental_release.yml, which has always stamped the
      # time (EXP_%Y%m%d-%H%M%S); this is the same shape without the prefix, so
      # the two remain distinguishable at a glance and both still sort
      # chronologically. UTC for the same reason that file uses it: a tag should
      # not depend on where the runner thinks it is.
      #
      # The RELEASE NAME deliberately stays date-only -- FOG parses its first
      # three characters ("Lat") for the Kernel Update page. Only the tag
      # changes here, and nothing parses the tag: Route::kernelOrInitJson()
      # passes tag_name through for display, and the installer's
      # fosLatestURL resolves releases/latest/download by release, not by name.
      - name: Set tag name variable
        run: |
          echo "TAG_NAME=$(date -u '+%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Get Linux Kernel version from build.sh
        run: |
          echo "LINUX_KERNEL_VER=$(cat build.sh | sed -n -e 's/^.*KERNEL_VERSION=//p' | cut -d\' -f 2)" >> $GITHUB_ENV

      - name: Get Buildroot version from build.sh
        run: |
          echo "BUILDROOT_VER=$(cat build.sh | sed -n -e 's/^.*BUILDROOT_VERSION=//p' | cut -d\' -f 2)" >> $GITHUB_ENV

      # DO NOT change the release name. FOG uses this format to grab the releases for the Kernel Update page.
      - name: Set release name and tag name variable if it is an Official FOG release
        run: |
          is_official="${{ inputs.is_official_release }}"
          fog_version="${{ inputs.official_fog_version }}"
          if [[ ${{ inputs.is_official_release }} == "true" ]]; then
            echo "RELEASE_NAME=FOG $fog_version kernels and inits" >> $GITHUB_ENV
            echo "TAG_NAME=$fog_version" >> $GITHUB_ENV
          fi

      - name: Export tag name
        id: export_tag
        run: echo "tag_name=${{ env.TAG_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Run sha256 checksum on all files
        run: |
          cd distribution-files
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      # The authoritative check, covering both paths and anything the naming
      # scheme cannot anticipate -- a hand-created tag, a re-run of an old
      # workflow_dispatch, a tag pushed while these builds were running. The
      # timestamped tag makes a dated collision unreachable in practice, but a
      # naming scheme is a heuristic and this is the invariant: never replace
      # the assets of a release that already exists.
      #
      # Runs after the checksums so a genuine build problem is still reported
      # first, and before the upload so nothing is published either way.
      - name: Refuse if the release tag already exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG_NAME already exists -- refusing to overwrite its assets. Nothing was published."
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Linux kernel ${{ env.LINUX_KERNEL_VER }}
            Buildroot ${{ env.BUILDROOT_VER }}
          tag_name: ${{ env.TAG_NAME }}
          files: |
            distribution-files/arm_Image
            distribution-files/arm_Image.sha256
            distribution-files/arm_init.cpio.gz
            distribution-files/arm_init.cpio.gz.sha256
            distribution-files/bzImage
            distribution-files/bzImage.sha256
            distribution-files/bzImage32
            distribution-files/bzImage32.sha256
            distribution-files/init.xz
            distribution-files/init.xz.sha256
            distribution-files/init_32.xz
            distribution-files/init_32.xz.sha256

      # Same guard as the one in make_usb.yml, and for the same reason: an
      # individual asset upload can die mid-transfer while the step as a whole
      # still reports success, publishing a release that looks complete and is
      # not. That is worse here than for the USB image -- these twelve files are
      # what every branch install pulls, and a short bzImage or init.xz is a
      # broken deploy for anyone who fetches it before someone notices.
      #
      # The expected set is taken from what the build actually produced rather
      # than from a second copy of the list above, so the two cannot drift. If
      # dist ever gains a file that is deliberately not published, this fails
      # the release until the lists are reconciled, which is the right way round
      # for a release path (ADR-0003: fail loud rather than ship something
      # half-written).
      - name: Verify uploaded assets, re-uploading any that are missing or short
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # +e explicitly: Actions runs `run:` blocks under `bash -e`, which would
          # abort this step the moment a `gh release view` call failed -- i.e. on
          # exactly the transient API failure the retry loop exists to survive.
          # Errors are handled per-command below instead.
          set +e
          set -uo pipefail
          for attempt in 1 2 3; do
            incomplete=()
            for f in distribution-files/*; do
              name=$(basename "$f")
              want=$(stat -c%s "$f")
              got=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
                      --json assets -q ".assets[]|select(.name==\"$name\")|.size" 2>/dev/null)
              if [[ "$got" != "$want" ]]; then
                echo "::warning::$name is ${got:-absent} on release $TAG_NAME, expected $want bytes"
                incomplete+=("$f")
              fi
            done
            if [[ ${#incomplete[@]} -eq 0 ]]; then
              echo "All release assets present on $TAG_NAME at their expected sizes."
              exit 0
            fi
            if [[ $attempt -lt 3 ]]; then
              echo "Re-uploading ${#incomplete[@]} asset(s) (attempt $attempt of 3)..."
              gh release upload "$TAG_NAME" "${incomplete[@]}" \
                --repo "$GITHUB_REPOSITORY" --clobber || true
              sleep $((attempt * 10))
            fi
          done
          echo "::error::Release assets still missing or truncated on $TAG_NAME after 3 attempts -- $TAG_NAME is incomplete."
          exit 1

  add_usb_image:
    needs: release

    if: needs.release.result == 'success'

    # Granted explicitly rather than inherited. A called workflow can never hold
    # more permission than its caller, so make_usb.yml's own `contents: write`
    # is capped by whatever this workflow has -- and with no block here that is
    # the repo-wide default. It is `write` today, so this changes nothing; if
    # that default is ever tightened to read-only (a common org-wide hardening)
    # the USB upload would start failing at the very end of a release, after
    # every build had already succeeded.
    permissions:
      contents: write

    uses: ./.github/workflows/make_usb.yml
    with:
      tag_name: ${{ needs.release.outputs.tag_name }}
    # A called workflow sees no secrets unless they are passed, and make_usb.yml
    # needs FOG_WORKFLOWS_PRIVATE_KEY to mint its own App token. Without this the
    # USB upload is the one step in a release that is not the FOG bot -- and it
    # fails outright rather than falling back, since an empty private key is not
    # a valid one.
    secrets: inherit
