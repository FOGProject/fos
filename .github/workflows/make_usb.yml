name: Add USB Image to Release

on:
  release:
    types:
      - published
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  # Lets the image be rebuilt for a release that already exists, without
  # cutting a new one -- useful when the build is changed, or when a release
  # predates the workflow being wired up.
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build the USB image for
        required: true
        type: string

permissions:
  contents: write

# One USB build per release tag. Nothing can collide today: the release
# published by create_release.yml is created with GITHUB_TOKEN, and a release
# created that way deliberately does not re-trigger workflows, so the
# `release: published` trigger and the `workflow_call` path never both fire.
# That protection is real but invisible, and it disappears the moment the
# release step uses a PAT -- at which point two runs would build and upload the
# same asset to the same tag at once. Stating it here costs nothing and does not
# depend on remembering why it was safe.
concurrency:
  group: make-usb-${{ inputs.tag_name || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  add-usb-image:
    # Pinned rather than ubuntu-latest, matching the two release workflows.
    # `latest` moves under you between runs, which is exactly the kind of
    # surprise a release path should not carry.
    runs-on: ubuntu-24.04

    # A successful run takes well under a minute; this only catches a hang,
    # which would otherwise sit for the 6 hour default.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set tag name
        run: echo "TAG_NAME=${{ inputs.tag_name || github.event.release.tag_name }}" >> "$GITHUB_ENV"

      - name: Create USB Image
        run: |
            # -y and an update first: the runner has no tty, so an unattended
            # apt-get would hit the confirm prompt, read EOF and abort.
            sudo apt-get update
            sudo apt-get install -y grub-efi-amd64 parted kpartx
            sudo ./create-usb-image.sh "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}"

      # Every other published artifact ships a .sha256 beside it -- build.sh
      # writes one for each kernel and init, and the release job verifies the
      # whole set with `sha256sum -c`. The USB image was the exception, and it
      # is the one asset a user writes straight to physical media, so it is the
      # one where a silently truncated or corrupted download matters most.
      #
      # Generated from inside /tmp so the file records a bare filename, the same
      # way build.sh does it. `sha256sum -c` then works in whatever directory
      # someone downloads the pair into; an absolute path would only verify on
      # a machine that happened to put it in /tmp.
      - name: Checksum USB image
        run: |
            cd /tmp
            sha256sum fos-usb.img > fos-usb.img.sha256
            cat fos-usb.img.sha256

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            /tmp/fos-usb.img
            /tmp/fos-usb.img.sha256

      # Verify rather than trust, because a partial upload here fails silently.
      #
      # On 2026-08-06 this step uploaded fos-usb.img.sha256 fine and then died
      # with `other side closed` partway through fos-usb.img itself. The release
      # was left advertising a checksum for a file that was not present -- and
      # nothing downstream noticed, because the release page renders happily
      # with a missing asset and every other job in the run was green. The only
      # user-visible symptom is `sha256sum -c` failing on a pair someone
      # downloaded, long after the fact.
      #
      # A truncated transfer is a transport failure, which is precisely the kind
      # that succeeds on a second attempt, so re-upload rather than just report.
      # Sizes are compared instead of checksums deliberately: the failure being
      # guarded against is a short or absent object, GitHub stores what it
      # received, and re-hashing a 128 MiB asset over the network on every
      # release buys nothing against that.
      - name: Verify uploaded assets, re-uploading any that are missing or short
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          files=(/tmp/fos-usb.img /tmp/fos-usb.img.sha256)
          for attempt in 1 2 3; do
            incomplete=()
            for f in "${files[@]}"; do
              name=$(basename "$f")
              want=$(stat -c%s "$f")
              got=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
                      --json assets -q ".assets[]|select(.name==\"$name\")|.size" 2>/dev/null)
              if [[ "$got" != "$want" ]]; then
                echo "::warning::$name is ${got:-absent} on release $TAG_NAME, expected $want bytes"
                incomplete+=("$f")
              fi
            done
            if [[ ${#incomplete[@]} -eq 0 ]]; then
              echo "All USB assets present on $TAG_NAME at their expected sizes."
              exit 0
            fi
            if [[ $attempt -lt 3 ]]; then
              echo "Re-uploading ${#incomplete[@]} asset(s) (attempt $attempt of 3)..."
              gh release upload "$TAG_NAME" "${incomplete[@]}" \
                --repo "$GITHUB_REPOSITORY" --clobber || true
              sleep $((attempt * 10))
            fi
          done
          echo "::error::USB assets still missing or truncated on $TAG_NAME after 3 attempts -- the release is incomplete."
          exit 1
